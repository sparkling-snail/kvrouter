# Four vLLM instances (one GPU each) for scripts/gpu_run.sh, which brings up
# the first $NUM_GPUS of them and runs bin/router + bin/bench on the host.
# Needs NVIDIA GPUs + nvidia-container-toolkit.
#   MODEL=Qwen/Qwen2.5-7B-Instruct docker compose -f deploy/docker-compose.vllm.yml up vllm-0 vllm-1
#
# The image is pinned so results are reproducible; gpu_run.sh also records the
# version each server reports. VLLM_SERVER_DEV_MODE enables POST
# /reset_prefix_cache, used to start every policy with cold caches.
# The router service is opt-in (--profile router) so it doesn't hold :9000
# while gpu_run.sh starts its own router per policy.
x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_VERSION:-v0.31.0}
  ipc: host
  environment:
    - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    - VLLM_SERVER_DEV_MODE=1
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
  command: ["--model", "${MODEL:-Qwen/Qwen2.5-7B-Instruct}", "--enable-prefix-caching",
            "--enable-prompt-tokens-details", "--gpu-memory-utilization", "${GPU_MEM_UTIL:-0.90}",
            "--max-model-len", "${MAX_MODEL_LEN:-16384}", "--seed", "0"]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 10s
    retries: 90

services:
  vllm-0:
    <<: *vllm
    ports: ["8001:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]

  vllm-1:
    <<: *vllm
    ports: ["8002:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]

  vllm-2:
    <<: *vllm
    ports: ["8003:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["2"], capabilities: [gpu]}]

  vllm-3:
    <<: *vllm
    ports: ["8004:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["3"], capabilities: [gpu]}]

  router:
    profiles: [router]
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["-listen", ":9000", "-policy", "prefix",
              "-backends", "http://vllm-0:8000,http://vllm-1:8000,http://vllm-2:8000,http://vllm-3:8000"]
    ports: ["9000:9000"]
    depends_on:
      vllm-0: {condition: service_healthy}
      vllm-1: {condition: service_healthy}
      vllm-2: {condition: service_healthy}
      vllm-3: {condition: service_healthy}
